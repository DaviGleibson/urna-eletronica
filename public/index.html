<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Aprenda como votar na urna eletrônica">
  <title>Aprenda como Votar</title>
  <link rel="icon" href="imagens/o-time.png">
  <link rel="apple-touch-icon" href="imagens/o-time.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="aviso-horizontal" class="aviso-horizontal" role="dialog" aria-live="polite" aria-label="Vire o celular na horizontal">
    <div class="celular-girar" aria-hidden="true">
      <span class="celular-corpo"></span>
    </div>
    <p class="aviso-titulo">Vire o celular</p>
    <p class="aviso-texto">A votação só começa na horizontal</p>
    <p class="aviso-texto aviso-musica">Toque para ouvir</p>
  </div>

  <main id="app">
    <section id="tela-intro" class="tela ativa" aria-label="Tela inicial">
      <img
        src="imagens/como-votar.png"
        alt="Aprenda como Votar — o time de Lula em Pernambuco"
        class="img-intro"
      >
      <p class="dica">Toque para começar</p>
    </section>

    <section id="tela-urna" class="tela" aria-label="Urna eletrônica" hidden>
      <div class="urna-caixa">
        <img
          id="img-urna"
          src="imagens/urna.png"
          alt="Urna eletrônica da Justiça Eleitoral"
          class="img-urna"
        >
        <div id="urna-mapa" class="urna-mapa">
          <div class="urna-tela">
            <img id="tela-candidato" alt="" hidden>
            <div id="tela-candidato-html" class="tela-candidato-html" hidden>
              <div class="chapa-topo">
                <div class="chapa-info">
                  <p class="tela-cargo-label">SEU VOTO PARA</p>
                  <p id="chapa-cargo" class="tela-cargo"></p>
                  <p class="chapa-linha"><span class="chapa-rotulo">Número:</span> <span id="chapa-numero" class="chapa-valor chapa-numero"></span></p>
                  <p class="chapa-linha"><span class="chapa-rotulo">Nome:</span> <span id="chapa-nome" class="chapa-valor"></span></p>
                </div>
                <img id="chapa-foto" class="chapa-foto" src="" alt="">
              </div>
              <div class="chapa-rodape">
                <p>Aperte a Tecla</p>
                <p><strong>VERDE</strong> para <strong>CONFIRMAR</strong></p>
                <p><strong>LARANJA</strong> para <strong>CORRIGIR</strong></p>
              </div>
            </div>
            <div id="tela-digitacao" class="tela-digitacao">
              <p class="tela-cargo-label">SEU VOTO PARA</p>
              <p id="tela-cargo" class="tela-cargo">Deputada Federal</p>
              <p class="tela-numero-label">Número:</p>
              <p id="tela-digitos" class="tela-digitos"></p>
            </div>
          </div>

          <button type="button" class="tecla tecla-1" data-digito="1" aria-label="Tecla 1">
            <img src="imagens/1.png" alt="">
          </button>
          <button type="button" class="tecla tecla-2" data-digito="2" aria-label="Tecla 2"></button>
          <button type="button" class="tecla tecla-3" data-digito="3" aria-label="Tecla 3">
            <img src="imagens/3.png" alt="">
          </button>
          <button type="button" class="tecla tecla-4" data-digito="4" aria-label="Tecla 4"></button>
          <button type="button" class="tecla tecla-5" data-digito="5" aria-label="Tecla 5"></button>
          <button type="button" class="tecla tecla-6" data-digito="6" aria-label="Tecla 6"></button>
          <button type="button" class="tecla tecla-7" data-digito="7" aria-label="Tecla 7"></button>
          <button type="button" class="tecla tecla-8" data-digito="8" aria-label="Tecla 8"></button>
          <button type="button" class="tecla tecla-9" data-digito="9" aria-label="Tecla 9"></button>
          <button type="button" class="tecla tecla-0" data-digito="0" aria-label="Tecla 0">
            <img src="imagens/0.png" alt="">
          </button>
          <button type="button" class="tecla tecla-corrige" data-acao="corrige" aria-label="Corrige"></button>
          <button type="button" class="tecla tecla-confirma" data-acao="confirma" aria-label="Confirma"></button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/app.js?v=9"></script>
</body>
</html>
